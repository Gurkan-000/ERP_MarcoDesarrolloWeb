<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP - Inicio</title>
  <link rel="stylesheet" href="../../static/css/styles.css">
</head>

<body>
  <div class="app-root">
    <section id="erp-app" class="erp-app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-icon" aria-hidden="true"><i data-lucide="shopping-bag"></i></div>
          <div>
            <h2>Lo Esencial</h2>
            <p>ERP Broasteria</p>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a class="nav-item" href="../venta.html">
            <i data-lucide="shopping-bag"></i>
            Punto de Venta
          </a>
          <a class="nav-item" href="../caja.html">
            <i data-lucide="wallet"></i>
            Caja
          </a>
          <a class="nav-item" href="../inventario.html">
            <i data-lucide="package"></i>
            Inventario
          </a>
          <a class="nav-item active" href="catalogoProducto.html">
            <i data-lucide="layout-dashboard"></i>
            Catalogo
          </a>
          <a class="nav-item" href="../usuario.html">
            <i data-lucide="users"></i>
            Usuarios
          </a>
          <a class="nav-item" href="../configuracion.html">
            <i data-lucide="settings"></i>
            Configuraciones
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="user-chip">
            <div class="user-avatar">A</div>
            <div class="user-meta">
              <p>Usuario</p>
              <span>Usuario</span>
            </div>
          </div>
          <form>
            <button type="submit" class="btn btn-ghost">
              <i data-lucide="log-out"></i>
              Cerrar Sesión
            </button>
          </form>
        </div>
      </aside>

      <div class="main-content">
        <header class="topbar">
          <h2>Catalogo</h2>
          <p id="today-date"></p>
        </header>

        <main class="content-area">
          <section id="module-catalogo" class="module active">
            <div class="module-header">
              <div class="tab-row">
                <a class="tab" data-tab="cat-productos" href="catalogoProducto.html">
                  <i data-lucide="package"></i>Productos
                </a>
                <a class="tab active" data-tab="cat-categorias" href="catalogoCategoria.html">
                  <i data-lucide="layers"></i>Categorias
                </a>
              </div>
              <div class="catalog-actions">
                <button class="btn btn-primary catalog-action" type="button" data-action="open-form"
                  data-target="cat-categorias">
                  <i data-lucide="plus"></i>
                  Nueva categoria
                </button>
              </div>
            </div>
            <div class="tab-content active" id="cat-categorias">
              <div class="card">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Categoria</th>
                      <th>Productos</th>
                    </tr>
                  </thead>
                  <tbody id="tbodyCategoria">
                  </tbody>
                </table>
                <form class="inline-form hidden" id="form-cat-categorias">
                  <div class="form-grid">
                    <label class="field">
                      <span>Categoria</span>
                      <input id="txtNombreCategoria" type="text" placeholder="Ej. Combos" />
                    </label>
                  </div>
                  <div class="form-actions">
                    <button id="btnGuardarCategoria" class="btn btn-primary" type="submit">Guardar</button>
                    <button class="btn btn-muted" type="button" data-action="cancel-form">Cancelar</button>
                  </div>
                </form>
              </div>
            </div>
          </section>
        </main>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../../static/js/app.js"></script>
  <script src="../../static/js/APIs_Categoria.js"></script>

</body>

</html>
