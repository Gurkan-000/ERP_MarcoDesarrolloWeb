<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP - Inicio</title>
  <link rel="stylesheet" href="../static/css/styles.css">
</head>

<body>
  <div class="app-root">
    <section id="erp-app" class="erp-app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-icon" aria-hidden="true"><i data-lucide="shopping-bag"></i></div>
          <div>
            <h2>Lo Esencial</h2>
            <p>ERP Broasteria</p>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a id="navSeccionVenta" class="nav-item" href="venta.html">
            <i data-lucide="shopping-bag"></i>
            Punto de Venta
          </a>
          <a id="navSeccionCaja" class="nav-item" href="caja.html">
            <i data-lucide="wallet"></i>
            Caja
          </a>
          <a id="navSeccionInventario" class="nav-item" href="inventario.html">
            <i data-lucide="package"></i>
            Inventario
          </a>
          <a id="navSeccionCatalogo" class="nav-item" href="catalogo/catalogoProducto.html">
            <i data-lucide="layout-dashboard"></i>
            Catalogo
          </a>
          <a id="navSeccionUsuario" class="nav-item active" href="usuario.html">
            <i data-lucide="users"></i>
            Usuarios
          </a>
          <a id="navSeccionConfiguracion" class="nav-item" href="configuracion.html">
            <i data-lucide="settings"></i>
            Configuraciones
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="user-chip">
            <div id="infoAvatar" class="user-avatar">A</div>
            <div class="user-meta">
              <p id="infoUsuario">Usuario</p>
              <span id="infoRol">Usuario</span>
            </div>
          </div>
          <form>
            <button type="submit" id="btnCerrarSesion" class="btn btn-ghost">
              <i data-lucide="log-out"></i>
              Cerrar Sesión
            </button>
          </form>
        </div>
      </aside>

      <div class="main-content">
        <header class="topbar">
          <h2>Usuarios</h2>
          <p id="today-date"></p>
        </header>

        <main class="content-area">
          <section id="module-usuarios" class="module active">
            <div id="formUsuario" class="card">
              <h3>Nuevo usuario</h3>
              <p class="muted hidden">Usuario creado correctamente.</p>
              <p class="muted hidden">No se pudo crear el usuario.</p>
              <form class="inline-form">
                <div class="form-grid">
                  <label class="field">
                    <span>Usuario</span>
                    <input id="txtUsuario" type="text" placeholder="Usuario" required />
                  </label>
                  <label class="field">
                    <span>Contraseña</span>
                    <input id="txtContrasena" type="password" placeholder="********" required />
                  </label>
                  <label class="field">
                    <span>Rol</span>
                    <select id="comboRol" required>
                      <option value="" disabled selected>Seleccione un rol</option>
                      <option value="Mesero">Mesero</option>
                      <option value="Cajero">Cajero</option>
                    </select>
                  </label>
                </div>
                <div class="form-actions">
                  <button id="btnGuardarUsuario" class="btn btn-primary" type="button">Guardar</button>
                </div>
              </form>
            </div>

            <div class="card">
              <h3>Gestion de Usuarios</h3>
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Usuario</th>
                    <th>Rol</th>
                  </tr>
                </thead>
                <tbody id="tbodyUsuario">
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </section>
  </div>

  <div id="toast-container" class="toastFixed"></div>


  <script src="../static/js/app.js"></script>
  <script src="../static/js/APIs_Usuario.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

</body>

</html>
