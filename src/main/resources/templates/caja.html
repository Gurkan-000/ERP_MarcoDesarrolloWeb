<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP - Inicio</title>
  <link rel="stylesheet" href="../static/css/styles.css">
</head>

<body>
  <div class="app-root">
    <section id="erp-app" class="erp-app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-icon" aria-hidden="true"><i data-lucide="shopping-bag"></i></div>
          <div>
            <h2>Lo Esencial</h2>
            <p>ERP Broasteria</p>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a id="navSeccionVenta" class="nav-item" href="venta.html">
            <i data-lucide="shopping-bag"></i>
            Punto de Venta
          </a>
          <a id="navSeccionCaja" class="nav-item active" href="caja.html">
            <i data-lucide="wallet"></i>
            Caja
          </a>
          <a id="navSeccionInventario" class="nav-item" href="inventario.html">
            <i data-lucide="package"></i>
            Inventario
          </a>
          <a id="navSeccionCatalogo" class="nav-item" href="catalogo/catalogoProducto.html">
            <i data-lucide="layout-dashboard"></i>
            Catalogo
          </a>
          <a id="navSeccionUsuario" class="nav-item" href="usuario.html">
            <i data-lucide="users"></i>
            Usuarios
          </a>
          <a id="navSeccionConfiguracion" class="nav-item" href="configuracion.html">
            <i data-lucide="settings"></i>
            Configuraciones
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="user-chip">
            <div id="infoAvatar" class="user-avatar">A</div>
            <div class="user-meta">
              <p id="infoUsuario">Usuario</p>
              <span id="infoRol">Usuario</span>
            </div>
          </div>
          <form>
            <button type="submit" id="btnCerrarSesion" class="btn btn-ghost">
              <i data-lucide="log-out"></i>
              Cerrar Sesión
            </button>
          </form>
        </div>
      </aside>

      <div class="main-content">
        <header class="topbar">
          <h2>Caja</h2>
        </header>

        <main class="content-area">
          <section class="module active">
            <div class="split-layout">
              <div class="card">
                <h3>Estado de Caja</h3>
                <div id="divCajaTurnoAbierto" class="hidden">
                  <p class="muted">Turno Abierto</p>
                  <div class="stat-card">
                    <div>
                      <p>Monto actual</p>
                      <h4 id="infoMontoActual" class="text-success">S/ 0.00</h4>
                      <p id="infoMontoInicial" class="muted monto-inicial">Monto
                        inicial: S/ 0.00</p>
                    </div>
                  </div>
                  <form class="inline-form">
                    <div class="form-grid">
                      <label class="field">
                        <span>Concepto</span>
                        <input type="text" id="txtConcepto" placeholder="Ej. Compra de hielo" />
                      </label>
                      <label class="field">
                        <span>Tipo</span>
                        <select id="TipoMovimiento">
                          <option value="INGRESO">Ingreso</option>
                          <option value="EGRESO">Egreso</option>
                        </select>
                      </label>
                      <label class="field">
                        <span>Metodo</span>
                        <select id="TipoPago">
                          <option value="EFECTIVO">Efectivo</option>
                          <option value="TARJETA">Tarjeta</option>
                          <option value="YAPE">Yape</option>
                        </select>
                      </label>
                      <label class="field">
                        <span>Monto</span>
                        <input type="text" id="txtMonto" step="0.1" min="0" placeholder="Ej. 15.00" />
                      </label>
                    </div>
                    <form>
                      <div class="form-actions">
                        <button class="btn btn-primary" id="btnRegistrarMovimiento" type="submit">Registrar
                          movimiento</button>
                      </div>
                    </form>
                    <div class="form-actions form-actions-end">
                      <form>
                        <button class="btn btn-danger" id="btnCerrarTurno" type="submit">Cerrar Turno</button>
                      </form>
                    </div>
                </div>
                <div id="divCajaTurnoCerrado" class="">
                  <p class="muted">Turno Cerrado</p>
                  <div class="stat-card">
                    <div>
                      <p>Ultimo monto</p>
                      <p class="muted" id="fechaUltimoMonto"></p>
                      <h4 class="text-info" id="infoUltimoMonto">S/ 0.00</h4>
                    </div>
                  </div>
                  <form class="inline-form">
                    <div class="form-grid">
                      <label class="field">
                        <span>Nuevo monto inicial</span>
                        <input type="number" id="txtMontoInicial" step="0.1" min="0" placeholder="Ej. 100.00" />
                      </label>
                    </div>
                    <div class="form-actions">
                      <button id="btnAbrirTurno" class="btn btn-primary" type="submit">Abrir Turno</button>
                    </div>
                  </form>
                </div>
              </div>
              <div class="card">
                <h3>Movimientos del Turno</h3>
                <div id="divListMovimientos" class="list">
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </section>
  </div>

  <div id="toast-container" class="toastFixed"></div>

  <script src="../static/js/app.js"></script>
  <script src="../static/js/APIs_Caja.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

</body>

</html>
