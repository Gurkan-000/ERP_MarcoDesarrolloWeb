<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP - Inicio</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
  <div class="app-root">
    <section id="erp-app" class="erp-app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-icon" aria-hidden="true"><i data-lucide="shopping-bag"></i></div>
          <div>
            <h2>Lo Esencial</h2>
            <p>ERP Broasteria</p>
          </div>
        </div>

        <nav class="sidebar-nav">
          <th:block th:if="${usuarioSesion != null}" th:each="vista : ${usuarioSesion.vistas}">
            <a class="nav-item" th:href="@{/venta}" th:if="${vista == 'venta'}">
              <i data-lucide="shopping-bag"></i>
              Punto de Venta
            </a>
            <a class="nav-item active" th:href="@{/caja}" th:if="${vista == 'caja'}">
              <i data-lucide="wallet"></i>
              Caja
            </a>
            <a class="nav-item" th:href="@{/inventario}" th:if="${vista == 'inventario'}">
              <i data-lucide="package"></i>
              Inventario
            </a>
            <a class="nav-item" th:href="@{/catalogo/productos}" th:if="${vista == 'catalogo'}">
              <i data-lucide="layout-dashboard"></i>
              Catalogo
            </a>
            <a class="nav-item" th:href="@{/usuarios}" th:if="${vista == 'usuario'}">
              <i data-lucide="users"></i>
              Usuarios
            </a>
            <a class="nav-item" th:href="@{/configuracion}" th:if="${vista == 'configuracion'}">
              <i data-lucide="settings"></i>
              Configuraciones
            </a>
          </th:block>
        </nav>

        <div class="sidebar-footer">
          <div class="user-chip">
            <div class="user-avatar">A</div>
            <div class="user-meta">
              <p>Usuario</p>
              <span>Usuario</span>
            </div>
          </div>
          <form method="get">
            <button type="submit" class="btn btn-ghost">
              <i data-lucide="log-out"></i>
              Cerrar Sesión
            </button>
          </form>
        </div>
      </aside>

      <div class="main-content">
        <header class="topbar">
          <h2>Caja</h2>
        </header>

        <main class="content-area">
          <section class="module active">
            <div class="split-layout">
              <div class="card">
                <h3>Estado de Caja</h3>
                <div >
                  <p class="muted" >Turno Abierto</p>
                  <div class="stat-card">
                    <div>
                      <p>Monto actual</p>
                      <h4 class="text-success">S/ 0.00</h4>
                      <p class="muted monto-inicial" >Monto
                        inicial: S/ 0.00</p>
                    </div>
                  </div>
                  <form class="inline-form" method="post">
                    <div class="form-grid">
                      <label class="field">
                        <span>Concepto</span>
                        <input type="text" placeholder="Ej. Compra de hielo"/>
                      </label>
                      <label class="field">
                        <span>Tipo</span>
                        <select>
                          <option value="Ingreso">Ingreso</option>
                          <option value="Egreso">Egreso</option>
                        </select>
                      </label>
                      <label class="field">
                        <span>Metodo</span>
                        <select>
                          <option value="Efectivo">Efectivo</option>
                          <option value="Tarjeta">Tarjeta</option>
                          <option value="Otro">Otro</option>
                        </select>
                      </label>
                      <label class="field">
                        <span>Monto</span>
                        <input type="number" step="0.1" min="0" placeholder="Ej. 15.00"/>
                      </label>
                    </div>
                    <div class="form-actions">
                      <button class="btn btn-primary" type="submit">Registrar movimiento</button>
                    </div>
                  </form>
                  <div class="form-actions form-actions-end">
                    <form method="post">
                      <button class="btn btn-danger" type="submit">Cerrar Turno</button>
                    </form>
                  </div>
                </div>
                <div >
                  <p class="muted">Turno Cerrado</p>
                  <div class="stat-card">
                    <div>
                      <p>Ultimo monto</p>
                      <h4 class="text-info" >S/ 0.00</h4>
                    </div>
                  </div>
                  <form class="inline-form" method="post">
                    <div class="form-grid">
                      <label class="field">
                        <span>Nuevo monto inicial</span>
                        <input type="number" step="0.1" min="0" placeholder="Ej. 100.00" />
                      </label>
                    </div>
                    <div class="form-actions">
                      <button class="btn btn-primary" type="submit">Abrir Turno</button>
                    </div>
                  </form>
                </div>
              </div>
              <div class="card">
                <h3>Movimientos del Turno</h3>
                <div class="list">
                  <div class="list-item">
                    <div>
                      <p class="title">Movimiento</p>
                      <span class="badge">Metodo</span>
                      <span class="badge badge-orange">Egreso</span>
                    </div>
                    <strong>
                      + S/ 0.00
                    </strong>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script th:src="@{/js/app.js}"></script>

</body>

</html>
