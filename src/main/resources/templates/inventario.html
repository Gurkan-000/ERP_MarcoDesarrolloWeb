<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP - Inicio</title>
  <link rel="stylesheet" href="../static/css/styles.css">
</head>

<body>
  <div class="app-root">
    <section id="erp-app" class="erp-app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-icon" aria-hidden="true"><i data-lucide="shopping-bag"></i></div>
          <div>
            <h2>Lo Esencial</h2>
            <p>ERP Broasteria</p>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a class="nav-item" href="venta.html">
            <i data-lucide="shopping-bag"></i>
            Punto de Venta
          </a>
          <a class="nav-item" href="caja.html">
            <i data-lucide="wallet"></i>
            Caja
          </a>
          <a class="nav-item active" href="inventario.html">
            <i data-lucide="package"></i>
            Inventario
          </a>
          <a class="nav-item" href="catalogo/catalogoProducto.html">
            <i data-lucide="layout-dashboard"></i>
            Catalogo
          </a>
          <a class="nav-item" href="usuario.html">
            <i data-lucide="users"></i>
            Usuarios
          </a>
          <a class="nav-item" href="configuracion.html">
            <i data-lucide="settings"></i>
            Configuraciones
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="user-chip">
            <div class="user-avatar">A</div>
            <div class="user-meta">
              <p>Usuario</p>
              <span>Usuario</span>
            </div>
          </div>
          <form>
            <button type="submit" class="btn btn-ghost">
              <i data-lucide="log-out"></i>
              Cerrar Sesión
            </button>
          </form>
        </div>
      </aside>

      <div class="main-content">
        <header class="topbar">
          <h2>Inventario</h2>
          <p id="today-date"></p>
        </header>

        <main class="content-area">
          <section class="module active">
            <div class="module-header">
              <div class="tab-row">
                <button class="tab active" data-tab="inv-stock">Stock Actual</button>
                <button class="tab" data-tab="inv-actualizar">Actualizar Stock</button>
              </div>
            </div>

            <div class="tab-content active" id="inv-stock">
              <div class="card">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Producto</th>
                      <th>Stock</th>
                    </tr>
                  </thead>
                  <tbody>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="tab-content" id="inv-actualizar">
              <div class="card">
                <form>
                  <table class="data-table stock-editor-table">
                    <thead>
                      <tr>
                        <th>Producto</th>
                        <th>Stock actual</th>
                        <th>Nuevo stock</th>
                      </tr>
                    </thead>
                    <tbody>
                    </tbody>
                  </table>
                  <div class="form-actions form-actions-end">
                    <button class="btn btn-primary" type="submit">Guardar cambios</button>
                  </div>
                </form>
              </div>
            </div>
          </section>
        </main>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../static/js/app.js"></script>
  <script src="../static/js/APIS_Inventario.js"></script>

</body>

</html>
